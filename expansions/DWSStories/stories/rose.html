I don’t remember being born.

Galaxials like to pretend they do. They talk about first light, first breath, first awareness—as if memory itself proves importance. Mine doesn’t start there. Mine starts later. Quietly. With absence.

I had three brothers and one sister. I know that because it’s been repeated to me enough times that it stuck, not because I remember them. Their names are gone. Faces too. When I try to recall them, I get impressions instead—someone taller blocking light, someone crying behind a door, someone laughing once and never again. That’s all.

People assume forgetting means not caring.

They’re wrong.

It means no one helped me remember.

I was small even then. Short for a Galaxial, thin, physically weak in ways that were impossible to hide. My arms shook when I lifted things. Running left me breathless. I learned early that my body would never protect me.

So I learned not to rely on it.

⸻

Magic came before trust.

I don’t remember when Supernova appeared. I only remember the aftermath—rooms too quiet, voices too careful, the way adults stopped arguing when I entered. Supernova isn’t magic itself. It’s a reservoir. A sun buried deep inside you that you’re allowed to touch, but not hold.

When I was young, I didn’t know how to measure it.

I just knew that when I reached for power, there was always more.

Too much more.

That scared them.

It should have meant teachers, guidance, patience. Instead, it meant distance. My parents didn’t hit me. They didn’t scream. That almost would’ve been easier. They just… stepped aside. Let others decide what to do with me.

I learned to float because walking hurt.

At first it was accidental—my feet lifting an inch off the ground when I got tired. Then a foot. Then enough that it felt normal. Floating didn’t strain my legs. It didn’t demand strength I didn’t have.

So I stayed there.

A girl in red and black, hovering just above the world, already separate from it.

⸻

The staff came into my life around then.

Long. Dark wood. Smooth where hands had worn it over decades—maybe centuries. It felt older than me and familiar in a way I can’t explain. When I held it, my magic stopped spilling everywhere. It behaved.

I was told it might’ve been my grandmother’s.

I don’t remember her either.

But the staff remembers me.

I knew its weight. Its balance. How it turned when I moved my wrist just right. Even before anyone taught me spellforms, I could channel through it cleanly. It was like speaking in a voice that already knew the words.

That was when they decided I couldn’t stay.

⸻

The druid camp wasn’t a punishment, no matter how much it felt like exile at first.

It was quiet. Too quiet. Trees instead of towers. Wind instead of voices. The land didn’t judge me. It didn’t stare when my feet didn’t touch the ground.

The druids didn’t rush me.

They watched.

That was new.

They taught me magic the way you teach breathing—slow, patient, repetitive. No praise when I did well. No anger when I failed. Just correction. Again and again. They taught me that magic isn’t force—it’s agreement.

Supernova stayed locked away.

They didn’t forbid it.

They just made sure I didn’t need it.

I made friends there. Real ones. People who didn’t care that I was small or strange or floated when I thought too hard. We trained together. Ate together. Argued about stupid things. For a while, I almost believed that was what life was supposed to be.

But childhood doesn’t last just because you want it to.

One by one, they left. Some returned to families. Some took vows. Some died later—I learned that much after the fact. None of them stayed in my life.

That’s a pattern, I’ve noticed.

People pass through me.

I pass through worlds.

⸻

By the time I left the camp, I wore red and black not because it looked intimidating, but because it reminded me I was still real. Still here. Still mine.

I was young for a Galaxial. Still am, technically.

Physically weak. Magically dangerous. Calm on the surface. Quiet by habit.

And already carrying more power than anyone expected me to survive.

That was my childhood.

Not tragic.

Not heroic.

Just… unfinished.

I left the druid camp without ceremony.

No goodbye feast. No speeches. Just a nod from the elders and a path that didn’t ask where I was going next. I floated as I always did, staff in hand, red and black catching dust and light, and I didn’t look back.

The bigger world wasn’t bigger because it was louder.

It was bigger because it didn’t care.

I drifted between places for a while—towns that smelled like metal and smoke, villages that looked at me like I was a problem waiting to happen. Eventually, I settled somewhere small. A 3D-plane settlement tucked into the curve of a much larger existence. Most people there didn’t think about that. They just lived.

There was an orphanage on the edge of town.

They needed a teacher.

I didn’t tell them what I was.

I just said I knew magic, patience, and how to listen.

That was enough.

⸻

Teaching wasn’t heroic. It was exhausting. My body was weak, and children are relentless. But they listened when I spoke, and they watched when I demonstrated, and slowly—quietly—they learned.

One child stayed with me.

Rin.

I remember his name because he was sadder than I was.

That’s not an exaggeration. Sadness recognizes itself. Rin didn’t cry much. Didn’t complain. He just sat too still, like moving might make something worse. When I floated, he watched my feet instead of my face.

“Does it hurt?” he asked me once.

“What?”

“Being… like that.”

I thought about lying.

“No,” I said. “It’s easier than walking.”

He nodded like that made sense.

I don’t know where Rin is now.

But I remember him.

That has to mean something.

⸻

The trouble didn’t start at the orphanage.

It started back near my home.

There was a man—big, broad, loud. The kind of person who thinks size is proof. He’d been watching me for weeks. I felt it before I saw it. The way air tightens when someone decides something stupid.

He stepped into my path one evening, blocking the road.

“Well I’ll be damned,” he said, grinning. “The floating witch.”

I didn’t stop floating.

“Move,” I said.

He laughed. “Make me.”

I could’ve left.

I didn’t.

That’s on me.

He reached out—not to hit me. Just to grab my sleeve. To prove he could.

I reacted.

⸻

“Don’t touch me,” I said.

He didn’t listen.

I drove the butt of my staff into the ground.

The world answered.

Not Supernova—not yet. Just magic. Clean, sharp, immediate.

The air cracked like ice splitting.

He flew backward, hit the dirt hard enough to knock the sound out of him. He rolled, groaning, tried to stand.

“I warned you,” I said, voice steady even as my hands shook.

He roared and charged.

I lifted my staff and twisted.

A force slammed into his chest and pinned him to the ground. The dirt beneath him cratered. His breath left him in a wet gasp.

“Stop,” he croaked.

I did.

Immediately.

The pressure vanished. He collapsed, coughing, alive—barely, but alive.

I floated there, heart pounding, realizing how close I’d come.

I never touched him.

He never touched me.

It didn’t matter.

People were already watching.

⸻

The council called me three days later.

Formal chamber. Stone seats. Cold air. Faces that thought they understood power because they’d read about it.

“You used excessive force,” one of them said.

“He attacked me,” I replied.

“You nearly killed him.”

“I didn’t.”

That annoyed them.

They decided to test me.

A mistake.

One of them raised a hand, murmured a spell—and a fireball streaked toward me, bright and fast.

I didn’t think.

I lifted my staff.

A barrier bloomed around me—perfect, smooth, absolute. The fireball struck it and vanished like it had never existed.

Silence.

Someone whispered, “Impossible.”

I lowered the staff.

“I didn’t come here to threaten anyone,” I said. “But don’t ever do that again.”

They dismissed me.

Not formally.

Fear does that.

⸻

I went home and stayed there.

Didn’t teach. Didn’t float outside. Just sat with my staff across my knees, listening to the world pretend nothing had changed.

Then the ground shook.

Not like magic.

Like something huge had shifted its weight.

My first thought was the council.

My second was worse.

I stood, heart racing, and whispered, “No…”

Because whatever was coming—

It wasn’t political.

It was hungry.

And it was awake.

When it touched down, I wasn’t ready.

No one was.

The sky didn’t split. There wasn’t thunder or warning or prophecy. It just arrived—a pressure so immense that the air compressed into silence. Then impact.

The Tri-City State vanished.

Not burned.

Not shattered.

Erased.

One moment it was towers and bridges and lights across the river. The next it was a flattening wave of black particulate mist that rolled outward like a living tide. Buildings dissolved into it. Stone, steel, people—gone inside seconds.

I felt it before I saw it.

Then it saw me.

The shockwave hit.

I remember lifting my staff.

I remember thinking barrier.

Then nothing.

⸻

When I woke up, the world was wrong.

The ground felt soft, like compacted ash. The sky was dim, choked with drifting black particles that moved against the wind. My ears rang. My body ached worse than it ever had.

The Tri-City State was gone.

In its place stood something vast and shifting—like a storm made of black sand suspended in midair. It wasn’t random. It was coordinated. Swarming inward toward a central mass that pulsed slowly, rhythmically.

Like a heartbeat.

The Galaxial Destroyer.

I tried to stand and nearly collapsed. Floating took effort now. Even breathing did.

“You’re late,” I muttered to myself.

Then the sand moved.

It peeled away from the main body and gathered into shapes.

Humanoid.

They weren’t people. Not anymore. They were silhouettes formed from the black particulate—faceless, twitching, slightly wrong at the joints. Dozens of them dropped from the drifting mass and turned toward me in unison.

Then they ran.

⸻

I forced myself upright.

“No,” I whispered. “Not like this.”

The first one lunged.

I pivoted and drove my staff through its torso. It burst apart into a spray of sand that tried to reform behind me. I twisted my wrist and released a pulse of magic that scattered it wider than cohesion would allow.

Three more hit me from the side.

One grabbed my arm.

Cold.

Not temperature—absence. Like it was trying to drain something.

I slammed my staff into the ground and released a circular shockwave. The nearest forms exploded outward, fragments dissolving midair.

But more were already coming.

They didn’t scream. Didn’t snarl. Just moved with single-minded hunger.

“Stay down,” I hissed, drawing deeper.

Not Supernova.

Not yet.

I needed control.

Vines erupted from the broken earth beneath them—druidic binding woven with arcane reinforcement. The sand-things tangled, slowed. I burned through them with precise bursts of condensed force, each strike deliberate.

But they kept coming.

Every time I destroyed one, more fell from the sky.

I was being tested.

⸻

It wasn’t until one of them hesitated that I noticed.

Just for a second.

Its head tilted.

And inside the shifting sand—

I saw eyes.

Not fully formed. Just an impression. A pattern in the swirl.

Familiar.

I froze.

The hesitation cost me. One struck from behind, driving me to my knees. Another wrapped around my staff, trying to pull it free.

“Get off,” I gasped, forcing magic into my limbs. I tore them apart with a surge that left my vision swimming.

Then I saw it again.

In the distance. In the greater mass.

A face forming in the black storm.

Not stable. Not solid. But there.

And I knew it.

Sage.

⸻

I hadn’t thought of her in years.

Not properly.

I had a sister. I knew that. But like the others, her name had blurred. Her voice lost. Childhood memory reduced to fragments.

But seeing her—

I remembered.

Sage had always been quieter than me. Watching. Thinking. Strong in ways that didn’t show.

Now her outline moved within the Destroyer’s core like a consciousness suspended in a sea of darkness.

“You’re not…” I breathed. “No.”

The swarm shifted.

The massive central form began pulling inward, consolidating. The mountain-sized body of particulate matter condensed toward a singular object suspended above the ruined city.

The Heart.

It pulsed once.

All remaining sand-forms around me disintegrated and streamed back toward it.

It was calling me.

⸻

I floated higher, ignoring the way my muscles trembled.

The Heart was larger than any structure I’d ever seen—an oblong mass of compressed black sand and lightless energy, rotating slowly. Within its translucent outer layer, currents of particulate flowed like blood through veins.

And in its center—

Sage.

Eyes closed.

Suspended.

Her hair drifted weightless around her face.

She looked peaceful.

The Destroyer was not a beast.

It was her.

Or what was left.

“You’re alive,” I whispered.

The Heart reacted.

The outer shell rippled. Tendrils of sand lashed outward, slamming into my barrier. The impact nearly knocked me unconscious again.

“You don’t recognize me,” I said, voice breaking. “It’s Rose.”

The currents inside accelerated.

Her eyes opened.

Black.

Not empty. Not gone. Just… distant.

And the swarm attacked.

⸻

This time it wasn’t dozens.

It was thousands.

They erupted from the Heart like a wave, surrounding me instantly. My barrier cracked under the pressure.

I couldn’t hold back anymore.

“I don’t want to hurt you,” I said, to her, to the storm.

The response was a crushing force that drove me toward the ground.

I reached inward.

Past the exhaustion.

Past fear.

To the sun.

Supernova answered.

Power flooded my veins—not wild, not uncontrolled. Vast. Enough to end this in a single act.

If I chose.

The swarm disintegrated around me as the energy radiated outward. The Heart’s surface fissured under the pressure.

I rose to eye level with her suspended form.

“Come back,” I said softly.

For a moment—

The black receded from her eyes.

Recognition flickered.

“Rose?” It wasn’t sound. It was intention. Memory.

Tears blurred my vision.

“Yes. It’s me.”

The Heart convulsed. The Destroyer instinct resisted, trying to reclaim control. The sand surged violently, tearing at my barrier, ripping at the edges of my focus.

I could end it.

Collapse the Heart.

Erase the swarm.

Erase her.

The power was there.

Waiting.

Instead—

I reached forward and placed my palm against the barrier between us.

“I’m not killing you,” I whispered.

Supernova didn’t explode.

It compressed.

Not outward—

Inward.

I forced the reservoir of power not into destruction, but into stabilization. Into containment. Into pulling her consciousness free from the storm that had wrapped itself around her.

The backlash was indescribable. Every nerve felt like it was being torn apart. My body screamed. My vision went white.

The Heart cracked.

Light—real light—pierced through the black mass.

The swarm froze mid-motion.

And then—

It fell.

All of it.

Like ash after a fire.

The mountain-sized form collapsed into inert sand that scattered harmlessly across the ruined expanse.

Sage fell with it.

I barely caught her before we hit the ground.

⸻

When the dust settled, there was no triumphant silence.

Just wind.

She was breathing.

Weak.

Human.

Galaxial.

Mine.

I lay there beside her, too drained to move, staring at the empty sky where a Destroyer had been.

People would come. They would see. They would fear me again.

Let them.

I didn’t destroy the world.

I saved my sister.

And that—

That was stronger.

Sage didn’t choose to become a Destroyer.

No one does.

A Galaxial Destroyer isn’t born from hatred or evil or ambition.

It’s born from excess.

Too much power in one body. Too much pressure with nowhere to go. The structure collapses. The soul fractures. The body can’t contain it, so it detonates into pure particulate—black, fluid, alive with instinct.

That’s what happened to her.

She didn’t become a monster.

She became overloaded.

And the world paid for it.

⸻

After the swarm fell and the sand went still, I carried her.

She was light. Too light.

I could feel the instability still pulsing inside her—like a star refusing to finish collapsing. If I left it alone, it would happen again. Maybe not tomorrow. Maybe not for years.

But it would.

So I did something I swore I never would.

I cursed her.

Not a cruel curse. Not one of pain.

A binding.

I rewrote the way her power condensed.

“You won’t explode again,” I whispered, pressing my staff to her chest. “If you break… you break inward.”

The spell burned through me. Supernova helped shape it, but I didn’t unleash it. I threaded it carefully, anchoring her structure to her will.

From that day on, Sage could become a Destroyer.

But not lose herself.

She could expand into that immense black particulate form—could let it tower and swallow and move like a storm—

And still remain inside it.

Still choose.

It was dangerous.

It was the only way.

⸻

Recovery wasn’t fast.

For a year, she drifted in and out.

Sometimes her eyes would clear for a few minutes. Sometimes hours. Sometimes she would look at me and I could see the storm still swirling behind her pupils.

“I remember light,” she said once.

“That’s a start,” I answered.

I stopped teaching at the orphanage.

I didn’t explain why.

Rin watched me leave from the doorway, silent as ever. I wanted to promise I’d come back.

I didn’t.

Instead, I took Sage back to the 4D plane.

Back to where we were born.

⸻

Our childhood home was smaller than I remembered.

Or maybe I was bigger.

The wood had warped. The air felt stale with memory. I floated through rooms that once felt enormous and found them ordinary.

Sage walked.

She was stronger physically than me. Always had been.

We found our mother’s grave behind the house.

Simple. Unremarkable.

Sage stared at it for a long time.

“She let it happen,” she said quietly.

I didn’t answer.

“She knew what was building inside me. She did nothing.”

I still didn’t answer.

Sage stepped forward and spat on the stone.

The sound felt louder than the Destroyer’s fall.

I didn’t stop her.

Some wounds don’t want comfort.

⸻

We were standing near the old fence when the air shifted.

Not subtle.

Not distant.

A pressure wave rolled across the horizon. Birds lifted from trees in a panic. The ground trembled.

Sage’s head snapped up.

“You feel that?”

“Yes.”

It wasn’t her.

This wasn’t unstable.

This was controlled.

And immense.

We climbed the ridge behind the house to get a clearer view.

In the far distance, beyond hills and broken stone, flashes of light burst against the sky. Not explosions—collisions. Power striking power.

The next morning, the news carried it.

A distant ground. A remote territory. Two figures clashing.

One of them—

Was our father.

⸻

The image flickered across the broadcast crystal.

He looked older. Harder. Radiating power I hadn’t felt since childhood—contained, deliberate, overwhelming.

And he was losing.

We didn’t wait.

The closer we got, the worse it became.

The air itself resisted us. Every clash between the two combatants sent shockwaves outward, bending trees, cracking earth. It felt like standing too close to Supernova—except it wasn’t mine.

It was equal.

Or greater.

Sage staggered at one impact. I caught her arm.

“That’s not normal,” she said.

“No,” I agreed.

We crested the final hill.

And the force of the next collision hit us full in the chest, nearly throwing us backward.

Through the haze of dust and light—

We saw him.

Our father, suspended midair, locked in combat with someone whose silhouette blurred from the sheer density of power surrounding them.

Every strike warped the space around them.

This wasn’t a duel.

This was annihilation barely held in check.

Sage whispered, “Who is that?”

I didn’t answer.

Because the unknown figure turned slightly—

And even from that distance—

I felt it.

A reservoir.

A compression.

A sun.

Not mine.

Not Sage’s.

But something that could rival Supernova.

The two forces collided again—

And the horizon went white.
